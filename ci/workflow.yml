name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Fetch A2UI spec schemas (validation fixtures)
        run: bash research/fetch_schemas.sh
      - name: Validate the marketplace dataset (FR-6 floor)
        run: python data/generate_listings.py && python data/validate_listings.py
      - name: Run tests
        run: cd backend && python -m pytest tests/ -q
